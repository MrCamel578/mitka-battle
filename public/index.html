<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131d"><title>МитькаBattle — CS2 кейсы</title>
<style>
:root{--bg:#10131d;--panel:#191e2b;--panel2:#202638;--line:#30384c;--text:#f2f4fa;--muted:#929bb0;--orange:#ff7438;--green:#6ee7a1;--red:#ff6878;--blue:#7da7ff;--gold:#ffcf70}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#39244b 0,transparent 34%),radial-gradient(ellipse at 90% 12%,#43261e 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:1px solid var(--line);background:#252c3e;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;transition:.16s transform,.16s border-color,.16s background}button:hover:not(:disabled){transform:translateY(-1px);border-color:#68738d}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:linear-gradient(135deg,#ff8745,#f34c2c);border-color:#ff8a52;color:#fff;box-shadow:0 8px 24px #ff64231c}.good{background:#183c32;border-color:#2d775b}.danger{background:#43232d;border-color:#743342}.quiet{background:transparent}.small{padding:6px 9px;font-size:12px}.muted{color:var(--muted)}.apphead{position:sticky;top:0;z-index:5;background:#10131de8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.headin{max-width:1420px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:24px}.brand{font-size:21px;font-weight:950;letter-spacing:-.8px;white-space:nowrap;cursor:pointer}.brand b{color:var(--orange)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px}.nav{display:flex;gap:7px;flex:1;flex-wrap:wrap}.nav button{background:transparent;border-color:transparent;color:#aeb7ca;padding:9px 12px}.nav button.active{background:#282d3d;color:white;border-color:#424a60}.userbar{display:flex;align-items:center;gap:10px;white-space:nowrap}.balance{font-weight:900;color:var(--gold);font-size:16px}.sound{padding:8px 10px}.wrap{max-width:1420px;margin:0 auto;padding:24px 22px 60px}.hero{border:1px solid #ffffff15;border-radius:22px;padding:30px;background:linear-gradient(110deg,#24233a,#1a1e2c 65%,#30231f);display:grid;grid-template-columns:1.4fr .6fr;gap:24px;align-items:center;overflow:hidden}.eyebrow{color:var(--orange);font-size:11px;letter-spacing:2px;font-weight:900;text-transform:uppercase}.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.04;letter-spacing:-1.5px;margin:12px 0}.hero h1 span{color:var(--orange)}.hero p{max-width:620px;color:#aeb6c9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#11152188;border:1px solid #ffffff12;border-radius:15px;padding:17px}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}.sectionhead h2{margin:0;font-size:22px;letter-spacing:-.5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.field{background:#111521;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;min-width:190px;outline:none}.field:focus{border-color:var(--orange)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.case{position:relative;min-height:205px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,#22283a,#171b28);padding:15px;overflow:hidden;cursor:pointer}.case:before{content:"";position:absolute;inset:auto -25px -70px 20%;height:130px;background:var(--glow,#ff7438);filter:blur(65px);opacity:.2}.case:hover{border-color:#69758d;transform:translateY(-2px)}.casevisual{height:100px;display:flex;align-items:center;justify-content:center;position:relative}.casevisual img{max-width:100%;max-height:110px;object-fit:contain;filter:drop-shadow(0 10px 15px #0008)}.caseglyph{font-size:42px;font-weight:1000;color:#ffb181;text-shadow:0 8px 25px #ff743855}.case h3{position:relative;margin:8px 0 3px;font-size:15px;text-transform:capitalize}.case .meta{color:var(--muted);font-size:12px}.casefoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;position:relative}.price{font-weight:900;color:var(--gold)}.panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,#1c2231,#171b27);padding:18px}.panel h3{margin:0 0 5px}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.layout3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:11px;margin-top:15px}.skin{position:relative;border:1px solid var(--rarity,#596276);border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#22283a,#171b27);min-width:0}.skin.selected{outline:2px solid var(--orange);outline-offset:1px}.skin.locked{border-color:#6c7da2;background:linear-gradient(145deg,#252d40,#171b27)}.skinimg{height:112px;display:flex;align-items:center;justify-content:center;padding:9px;background:radial-gradient(ellipse at 50% 80%,var(--rarityGlow,#ffffff12),transparent 70%)}.skinimg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 12px #0009)}.skinplaceholder{font-size:10px;font-weight:950;letter-spacing:2px;color:#69758d;border:1px dashed #3a4358;padding:14px;border-radius:9px}.skinbody{padding:10px}.skinname{font-size:12px;font-weight:800;min-height:34px;overflow-wrap:anywhere}.skinbottom{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:8px}.raritylabel{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--rarity)}.lockbtn{position:absolute;right:7px;top:7px;border-radius:9px;padding:6px 8px;background:#10131dcc;border-color:#ffffff24;z-index:1}.lockbtn.islocked{background:#344260;border-color:#7d9bd2}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#aeb8cb;font-size:11px}.subtext{color:var(--muted);font-size:12px}.case-detail{display:grid;grid-template-columns:300px 1fr;gap:22px}.case-large{display:flex;align-items:center;justify-content:center;min-height:250px;border-radius:18px;background:radial-gradient(circle,#ff743824,transparent 70%),#171b28;border:1px solid var(--line)}.case-large img{max-width:80%;max-height:230px;object-fit:contain}.resultbox{margin-top:20px;border:1px solid #ff874655;background:#211d25;border-radius:17px;padding:18px}.resultbox h3{margin-top:0}.notice{position:fixed;right:20px;bottom:20px;z-index:20;max-width:360px;padding:13px 16px;background:#222a3b;border:1px solid #47526b;border-radius:12px;box-shadow:0 14px 40px #0007}.notice.error{border-color:#aa4050}.notice.goodnote{border-color:#318d65}.empty{padding:36px 16px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.bar{height:8px;border-radius:99px;background:#30364a;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb16b,#ff6538);width:0}.modal{position:fixed;inset:0;z-index:30;background:#080a10c9;display:grid;place-items:center;padding:18px}.modalbox{width:min(440px,100%);padding:24px;border:1px solid #424b61;border-radius:20px;background:#1a2030;box-shadow:0 30px 100px #0009}.modalbox h2{margin:0 0 8px}.modalbox form{display:grid;gap:10px;margin-top:18px}.modalbox .field{width:100%}.hidden{display:none!important}.contract-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.result-skin{max-width:260px;margin:15px auto}.spin{animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{from{transform:scale(.98)}to{transform:scale(1.03)}}footer{border-top:1px solid #ffffff10;color:#6f7890;text-align:center;padding:22px;font-size:11px}@media(max-width:900px){.headin{flex-wrap:wrap;gap:10px}.nav{order:3;flex-basis:100%;overflow:auto;flex-wrap:nowrap}.userbar{margin-left:auto}.hero{grid-template-columns:1fr}.case-detail{grid-template-columns:1fr}.case-large{min-height:170px}.layout2{grid-template-columns:1fr}.layout3{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:15px 12px 40px}.headin{padding:10px 12px}.brand{font-size:18px}.userbar{gap:6px}.balance{font-size:13px}.nav button{padding:8px;font-size:12px}.hero{padding:21px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:19px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.case{padding:10px;min-height:180px}.casevisual{height:80px}.skin-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.skinimg{height:88px}.sectionhead{align-items:start;flex-direction:column}.toolbar{width:100%}.field{min-width:0;flex:1;width:100%}.layout3{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="apphead"><div class="headin"><div class="brand" onclick="go('cases')">Митька<b>Battle</b><small>CS2 CASE OPENING</small></div><nav class="nav"><button data-page="cases" onclick="go('cases')">Кейсы</button><button data-page="inventory" onclick="go('inventory')">Инвентарь</button><button data-page="upgrade" onclick="go('upgrade')">Апгрейд</button><button data-page="contracts" onclick="go('contracts')">Контракты</button></nav><div class="userbar"><button class="sound" id="soundBtn" onclick="toggleSound()" title="Звук">🔊 Звук: вкл.</button><span class="balance" id="balance">— ₽</span><button class="small" id="bonusBtn" onclick="claimBonus()">+ Бонус</button><button id="authBtn" class="primary" onclick="openAuth()">Войти</button></div></div></header>
<main class="wrap" id="app"><div class="empty">Загружаем игру…</div></main><footer>Внутриигровая симуляция CS2 · Баланс и цены не являются денежными средствами или ценами Steam.</footer><div id="notice" class="notice hidden"></div><div id="modal" class="modal hidden"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let CATALOG={SK:[],CASES:[]},user=null,page='cases',activeCase=null,caseCount=1,selectedUpgrade=new Set(),upgradeTarget=null,selectedContract=new Set(),busy=false,soundOn=localStorage.getItem('mb_sound')!=='off',audioCtx=null;
const RARITY={c:{name:'Потребительский',color:'#9aa3b4'},b:{name:'Промышленный',color:'#6aa9ff'},p:{name:'Армейский',color:'#b68cff'},k:{name:'Запрещённый',color:'#e875d2'},g:{name:'Тайный',color:'#ff626d'},y:{name:'Особый',color:'#ffcf70'}};
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0);
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageUrl(name){const item=CATALOG.SK.find(s=>s[0]===name);return item&&item[3]?`https://community.akamai.steamstatic.com/economy/image/${item[3]}/256fx256f`:''}
function imgMarkup(name,cls=''){const src=imageUrl(name);return src?`<img class="${cls}" src="${src}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'skinplaceholder',textContent:'CS2 SKIN'}))">`:`<span class="skinplaceholder">CS2 SKIN</span>`}
function sound(type='click'){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const cfg={click:[540,.045,'square'],open:[180,.22,'sawtooth'],win:[740,.3,'triangle'],contract:[380,.22,'triangle'],lock:[300,.08,'square'],fail:[130,.25,'sawtooth'] }[type]||[440,.08,'sine'];o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);if(type==='win'||type==='contract')o.frequency.exponentialRampToValueAtTime(cfg[0]*1.7,now+cfg[1]);else o.frequency.exponentialRampToValueAtTime(Math.max(50,cfg[0]*.55),now+cfg[1]);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);o.start(now);o.stop(now+cfg[1]+.02)}catch{}}
function toggleSound(){soundOn=!soundOn;localStorage.setItem('mb_sound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'🔊 Звук: вкл.':'🔇 Звук: выкл.';if(soundOn)sound('click')}
function toast(msg,type=''){const n=$('notice');n.textContent=msg;n.className='notice '+(type==='error'?'error':type==='good'?'goodnote':'');n.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.add('hidden'),3400)}
async function api(url,options={}){const res=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||`Ошибка сервера (${res.status})`);return data}
function setUser(u){user=u;const bal=$('balance'),auth=$('authBtn');bal.textContent=user?`${money(user.bal)} ₽`:'Гость';auth.textContent=user?user.name:'Войти';auth.onclick=user?logout:openAuth;}
function navActive(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function go(p){page=p;navActive();if(p==='cases')renderCases();else if(p==='inventory')renderInventory();else if(p==='upgrade')renderUpgrade();else if(p==='contracts')renderContracts();window.scrollTo({top:0,behavior:'smooth'})}
function requireUser(){if(user)return true;openAuth();return false}
function caseCard(c){return `<article class="case" style="--glow:hsl(${c.hue||24} 80% 55%)" onclick="openCasePage(${c.id})"><div class="casevisual"><span class="caseglyph">MB</span></div><h3>${escapeHtml(c.name)}</h3><div class="meta">${c.num||c.pool.length} предметов · до ${money(Math.max(...c.pool.map(x=>x.p)))} ₽</div><div class="casefoot"><span class="price">${money(c.price)} ₽</span><button class="primary small" onclick="event.stopPropagation();openCasePage(${c.id})">Открыть</button></div></article>`}
function renderCases(){const total=CATALOG.CASES.length;const skins=CATALOG.SK.length;$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">CS2 · Кейсы · Апгрейд</div><h1>Открывай кейсы.<br><span>Лови редкие скины.</span></h1><p>Собирай коллекцию, защищай любимые предметы замком и используй контракты, чтобы обменять несколько скинов на один новый.</p><div class="toolbar"><button class="primary" onclick="document.getElementById('caseList').scrollIntoView({behavior:'smooth'})">Выбрать кейс</button><button onclick="go('contracts')">✦ Контракты</button></div></div><div class="stats"><div class="stat"><strong>${total}</strong><span>кейсов</span></div><div class="stat"><strong>${skins}</strong><span>скинов в каталоге</span></div><div class="stat"><strong>${user?money(user.inv.length):'—'}</strong><span>предметов у тебя</span></div></div></section><div class="sectionhead" id="caseList"><div><h2>Выбери кейс</h2><div class="subtext">Результат определяет сервер, анимация лишь показывает выпадение.</div></div><div class="toolbar"><input id="caseSearch" class="field" placeholder="Найти кейс…" oninput="filterCases()"><select id="caseSort" class="field" onchange="filterCases()"><option value="default">По цене</option><option value="asc">Сначала дешёвые</option><option value="desc">Сначала дорогие</option></select></div></div><div class="grid" id="caseGrid">${CATALOG.CASES.map(caseCard).join('')}</div>`}
function filterCases(){const q=$('caseSearch').value.toLowerCase(),sort=$('caseSort').value;let cases=CATALOG.CASES.filter(c=>c.name.toLowerCase().includes(q));if(sort==='asc')cases.sort((a,b)=>a.price-b.price);if(sort==='desc')cases.sort((a,b)=>b.price-a.price);$('caseGrid').innerHTML=cases.map(caseCard).join('')||'<div class="empty">Кейсы не найдены.</div>'}
function openCasePage(id){activeCase=CATALOG.CASES.find(c=>c.id===id);caseCount=1;renderCasePage()}
function renderCasePage(){const c=activeCase;if(!c)return go('cases');$('app').innerHTML=`<button class="quiet" onclick="go('cases')">← Все кейсы</button><div class="case-detail" style="margin-top:16px"><div class="case-large"><span class="caseglyph" style="font-size:90px">MB</span></div><section class="panel"><div class="eyebrow">КЕЙС</div><h2 style="font-size:30px;margin:8px 0;text-transform:capitalize">${escapeHtml(c.name)}</h2><p class="muted">${c.num||c.pool.length} предметов в коллекции. Открытие списывает стоимость с баланса.</p><div class="contract-summary"><span class="pill">Цена: ${money(c.price)} ₽</span><span class="pill">Предметов: ${c.pool.length}</span></div><div class="toolbar" style="margin:16px 0"><button onclick="setCaseCount(-1)">−</button><strong id="caseCount" style="padding:10px">${caseCount}</strong><button onclick="setCaseCount(1)">+</button><button class="primary" id="openCaseBtn" onclick="openSelectedCase()">Открыть за ${money(c.price)} ₽</button></div><div id="caseResult"></div></section></div><div class="sectionhead"><h2>Содержимое кейса</h2><span class="pill">${c.pool.length} скинов</span></div><div class="skin-grid">${c.pool.slice().sort((a,b)=>b.p-a.p).map(s=>skinCard(s,-1,false)).join('')}</div>`}
function setCaseCount(n){caseCount=Math.max(1,Math.min(10,caseCount+n));$('caseCount').textContent=caseCount;$('openCaseBtn').textContent=`Открыть за ${money(activeCase.price*caseCount)} ₽`}
async function openSelectedCase(){if(!requireUser()||busy)return;busy=true;const btn=$('openCaseBtn');btn.disabled=true;btn.textContent='Открываем…';sound('open');try{const d=await api('/api/open-case',{method:'POST',body:JSON.stringify({caseId:activeCase.id,count:caseCount})});setUser(d.user);sound(d.wins.some(x=>x.r==='y'||x.r==='g')?'win':'click');$('caseResult').innerHTML=`<div class="resultbox"><h3>Выпало ${d.wins.length} предмет(а)</h3><div class="skin-grid">${d.wins.map(s=>skinCard(s,-1,false)).join('')}</div><p class="price">Общая стоимость: ${money(d.wins.reduce((a,x)=>a+x.p,0))} ₽</p><button onclick="go('inventory')">Перейти в инвентарь</button></div>`;toast('Кейс открыт!','good')}catch(e){toast(e.message,'error');sound('fail')}finally{busy=false;if($('openCaseBtn')){$('openCaseBtn').disabled=false;$('openCaseBtn').textContent=`Открыть за ${money(activeCase.price*caseCount)} ₽`}}}
function skinCard(s,index,withControls=true,selected=false){const rarity=RARITY[s.r]||RARITY.c;const locked=!!s.locked;return `<article class="skin ${selected?'selected':''} ${locked?'locked':''}" style="--rarity:${rarity.color};--rarityGlow:${rarity.color}22"><div class="skinimg">${imgMarkup(s.n)}</div>${withControls&&index>=0?`<button class="lockbtn ${locked?'islocked':''}" title="${locked?'Разблокировать':'Заблокировать'} скин" onclick="event.stopPropagation();toggleLock(${index})">${locked?'🔒':'♙'}</button>`:''}<div class="skinbody"><div class="skinname">${escapeHtml(s.n)}</div><div class="skinbottom"><span class="raritylabel">${rarity.name}</span><b class="price">${money(s.p)} ₽</b></div>${withControls&&index>=0?`<div class="toolbar" style="margin-top:9px">${page==='inventory'?`<button class="small danger" ${locked?'disabled':''} onclick="sellOne(${index})">Продать</button>`:''}${(page==='upgrade'||page==='contracts')?`<button class="small ${selected?'primary':''}" ${locked?'disabled':''} onclick="selectFor('${page}',${index})">${selected?'Выбран':'Выбрать'}</button>`:''}</div>`:''}</div></article>`}
function renderInventory(){if(!requireUser())return;const inv=user.inv||[],locked=inv.filter(s=>s.locked).length,available=inv.reduce((a,s)=>a+(s.locked?0:Number(s.p)),0);$('app').innerHTML=`<div class="sectionhead"><div><h2>Инвентарь</h2><div class="subtext">${inv.length} предметов · ${locked} заблокировано · можно продать на ${money(available)} ₽</div></div><div class="toolbar"><button onclick="sellAll()" class="danger">Продать всё незаблокированное</button></div></div>${inv.length?`<div class="skin-grid">${inv.map((s,i)=>skinCard(s,i,true)).join('')}</div>`:'<div class="empty">Инвентарь пуст. Открой кейс, чтобы получить первый скин.</div>'}`}
async function toggleLock(index){if(busy)return;busy=true;try{const locked=!user.inv[index].locked;const d=await api('/api/lock-skin',{method:'POST',body:JSON.stringify({index,locked})});setUser(d.user);sound('lock');if(page==='inventory')renderInventory();else if(page==='upgrade')renderUpgrade();else if(page==='contracts')renderContracts();toast(locked?'Скин заблокирован — его нельзя продать или использовать':'Скин разблокирован','good')}catch(e){toast(e.message,'error')}finally{busy=false}}
async function sellOne(index){if(!requireUser()||busy)return;if(user.inv[index]?.locked)return toast('Сначала разблокируй этот скин','error');if(!confirm(`Продать «${user.inv[index].n}» за ${money(user.inv[index].p)} ₽?`))return;busy=true;try{const d=await api('/api/sell',{method:'POST',body:JSON.stringify({indices:[index]})});setUser(d.user);sound('click');renderInventory();toast(`Продано за ${money(d.amount)} ₽`,'good')}catch(e){toast(e.message,'error')}finally{busy=false}}
async function sellAll(){if(!requireUser()||busy)return;const n=user.inv.filter(s=>!s.locked).length;if(!n)return toast('Нет незаблокированных скинов для продажи','error');if(!confirm(`Продать ${n} незаблокированных предметов? Заблокированные останутся в инвентаре.`))return;busy=true;try{const d=await api('/api/sell',{method:'POST',body:JSON.stringify({all:true})});setUser(d.user);sound('click');renderInventory();toast(`Продано на ${money(d.amount)} ₽`,'good')}catch(e){toast(e.message,'error')}finally{busy=false}}
function selectFor(which,index){if(user.inv[index]?.locked)return toast('Заблокированный скин нельзя использовать','error');const set=which==='contracts'?selectedContract:selectedUpgrade;if(set.has(index))set.delete(index);else set.add(index);if(which==='contracts')renderContracts();else renderUpgrade()}
function renderUpgrade(){if(!requireUser())return;const inv=user.inv||[],chosen=[...selectedUpgrade].filter(i=>inv[i]&&!inv[i].locked),stake=chosen.reduce((a,i)=>a+inv[i].p,0);selectedUpgrade=new Set(chosen);const targets=CATALOG.SK.map((s,i)=>({n:s[0],p:s[1],r:s[2],i})).filter(s=>s.p>stake).sort((a,b)=>a.p-b.p).slice(0,60);$('app').innerHTML=`<div class="sectionhead"><div><h2>Апгрейд</h2><div class="subtext">Выбери незаблокированные скины и цель дороже ставки.</div></div><span class="pill">Ставка: ${money(stake)} ₽</span></div><div class="layout2"><section class="panel"><h3>Твои скины</h3><p class="subtext">Заблокированные предметы исключены.</p><div class="skin-grid">${inv.map((s,i)=>skinCard(s,i,true,selectedUpgrade.has(i))).join('')}</div></section><section class="panel"><h3>Цель апгрейда</h3><input id="targetSearch" class="field" placeholder="Найти оружие…" oninput="filterTargets()" style="width:100%;margin:10px 0"><div class="subtext" id="upgradeChance">${upgradeTarget?`Шанс ${Math.min(90,stake/upgradeTarget.p*95).toFixed(2)}%`:'Выбери цель из списка'}</div><div id="targetGrid" class="skin-grid">${targets.map(t=>targetCard(t)).join('')}</div><div class="resultbox"><h3 id="chosenTarget">${upgradeTarget?escapeHtml(upgradeTarget.n):'Цель не выбрана'}</h3><button class="primary" id="upgradeBtn" ${!upgradeTarget||!chosen.length?'disabled':''} onclick="doUpgrade()">Испытать удачу</button><div id="upgradeResult" class="subtext" style="margin-top:10px"></div></div></section></div>`}
function targetCard(t){return `<article class="skin ${upgradeTarget&&upgradeTarget.i===t.i?'selected':''}" style="--rarity:${(RARITY[t.r]||RARITY.c).color}" onclick="chooseTarget(${t.i})"><div class="skinimg">${imgMarkup(t.n)}</div><div class="skinbody"><div class="skinname">${escapeHtml(t.n)}</div><div class="skinbottom"><span class="raritylabel">${(RARITY[t.r]||RARITY.c).name}</span><b class="price">${money(t.p)} ₽</b></div></div></article>`}
function filterTargets(){const q=$('targetSearch').value.toLowerCase();const chosen=[...selectedUpgrade].reduce((a,i)=>a+(user.inv[i]?.p||0),0);$('targetGrid').innerHTML=CATALOG.SK.map((s,i)=>({n:s[0],p:s[1],r:s[2],i})).filter(s=>s.p>chosen&&s.n.toLowerCase().includes(q)).sort((a,b)=>a.p-b.p).slice(0,60).map(targetCard).join('')||'<div class="empty">Нет целей.</div>'}
function chooseTarget(i){upgradeTarget={i,n:CATALOG.SK[i][0],p:CATALOG.SK[i][1]};renderUpgrade()}
async function doUpgrade(){if(!requireUser()||busy||!upgradeTarget)return;const indices=[...selectedUpgrade].filter(i=>user.inv[i]&&!user.inv[i].locked);if(!indices.length)return toast('Выбери предметы для ставки','error');busy=true;$('upgradeBtn').disabled=true;sound('open');try{const d=await api('/api/upgrade',{method:'POST',body:JSON.stringify({indices,targetIndex:upgradeTarget.i})});setUser(d.user);sound(d.win?'win':'fail');$('upgradeResult').innerHTML=d.win?`<strong style="color:var(--green)">Успех!</strong> Получен ${escapeHtml(d.item.n)} · ${money(d.item.p)} ₽`:`<strong style="color:var(--red)">Не повезло.</strong> Ставка сгорела. Шанс был ${Number(d.chance).toFixed(2)}%.`;selectedUpgrade.clear();upgradeTarget=null;renderUpgrade();$('upgradeResult').innerHTML=d.win?'<strong style="color:var(--green)">Апгрейд успешен!</strong> Скин добавлен в инвентарь.':'<strong style="color:var(--red)">Апгрейд не удался.</strong> Выбранные скины потеряны.'}catch(e){toast(e.message,'error');sound('fail')}finally{busy=false}}
function renderContracts(){if(!requireUser())return;const inv=user.inv||[],selected=[...selectedContract].filter(i=>inv[i]&&!inv[i].locked);selectedContract=new Set(selected);const total=selected.reduce((a,i)=>a+inv[i].p,0);$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">Trade-up contract</div><h1>Контракт <span>обмена</span></h1><p>Положи от 3 до 10 незаблокированных скинов. Контракт уберёт выбранные предметы и выдаст один новый скин из каталога. Итог показывается прямо здесь.</p><div class="contract-summary"><span class="pill">Выбрано: ${selected.length}/10</span><span class="pill">Сумма: ${money(total)} ₽</span><span class="pill">Ожидаемая зона: ${money(total*.85)}–${money(total*2.2)} ₽</span></div><button class="primary" id="contractBtn" ${selected.length<3||selected.length>10?'disabled':''} onclick="doContract()">Собрать контракт</button></div><div class="stat"><strong>3–10</strong><span>предметов за один новый скин</span><div class="bar"><i style="width:${Math.min(100,selected.length/10*100)}%"></i></div><div class="subtext">Блокировка защищает скин от случайного обмена.</div></div></section><div class="sectionhead"><div><h2>Выбери скины</h2><div class="subtext">Замок в правом верхнем углу блокирует предмет.</div></div><div class="toolbar"><button class="small" onclick="selectAllContract()">Выбрать до 10</button><button class="small" onclick="selectedContract.clear();renderContracts()">Сбросить</button></div></div>${inv.length?`<div class="skin-grid">${inv.map((s,i)=>skinCard(s,i,true,selectedContract.has(i))).join('')}</div>`:'<div class="empty">Инвентарь пуст — открой кейс, чтобы собрать контракт.</div>'}<div id="contractResult"></div>`}
function selectAllContract(){selectedContract.clear();(user.inv||[]).forEach((s,i)=>{if(!s.locked&&selectedContract.size<10)selectedContract.add(i)});renderContracts()}
async function doContract(){if(!requireUser()||busy)return;const indices=[...selectedContract];if(indices.length<3||indices.length>10)return toast('Нужно выбрать от 3 до 10 скинов','error');if(indices.some(i=>user.inv[i]?.locked))return toast('В контракте нельзя использовать заблокированные скины','error');busy=true;$('contractBtn').disabled=true;$('contractBtn').textContent='Собираем…';sound('contract');try{const d=await api('/api/contracts',{method:'POST',body:JSON.stringify({indices})});setUser(d.user);selectedContract.clear();sound('win');const resultHtml=`<div class="resultbox"><div class="eyebrow">КОНТРАКТ УСПЕШНО ЗАВЕРШЁН</div><h2>Новый скин получен!</h2><div class="result-skin">${skinCard(d.item,-1,false)}</div><div class="contract-summary" style="justify-content:center"><span class="pill">Вход: ${money(d.inputValue)} ₽</span><span class="pill">Награда: ${money(d.item.p)} ₽</span><span class="pill">Множитель: ×${Number(d.multiplier).toFixed(2)}</span></div><p class="subtext" style="text-align:center">Результат уже сохранён в инвентаре.</p><div style="text-align:center"><button onclick="go('inventory')">Открыть инвентарь</button><button class="primary" onclick="go('contracts')">Ещё контракт</button></div></div>`;renderContracts();$('contractResult').innerHTML=resultHtml;toast('Контракт завершён: получен новый скин','good')}catch(e){toast(e.message,'error');sound('fail')}finally{busy=false}}
function openAuth(){ $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="eyebrow">АККАУНТ</div><h2 id="authTitle">Войти в МитькаBattle</h2><p class="muted">Серверный аккаунт хранит баланс и инвентарь.</p><form id="authForm"><input class="field" id="authName" placeholder="Логин (3–16 символов)" minlength="3" maxlength="16" required autocomplete="username"><input class="field" id="authPass" type="password" placeholder="Пароль (минимум 8 символов)" minlength="8" maxlength="128" required autocomplete="current-password"><button class="primary" id="authSubmit">Войти</button></form><p class="subtext" id="authError"></p><button class="quiet" id="authSwitch" onclick="switchAuth()">Нет аккаунта? Зарегистрироваться</button><button class="quiet" onclick="closeAuth()" style="float:right">Закрыть</button></div>`;$('authForm').addEventListener('submit',submitAuth)}let registerMode=false;function switchAuth(){registerMode=!registerMode;$('authTitle').textContent=registerMode?'Создать аккаунт':'Войти в МитькаBattle';$('authSubmit').textContent=registerMode?'Зарегистрироваться':'Войти';$('authPass').minLength=registerMode?8:1;$('authSwitch').textContent=registerMode?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться'}function closeAuth(){$('modal').classList.add('hidden')}async function submitAuth(e){e.preventDefault();const name=$('authName').value.trim(),password=$('authPass').value;$('authError').textContent='';$('authSubmit').disabled=true;try{const d=await api(registerMode?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({name,password})});setUser(d.user);closeAuth();registerMode=false;toast('Добро пожаловать!','good');go(page)}catch(err){$('authError').textContent=err.message}finally{if($('authSubmit'))$('authSubmit').disabled=false}}async function claimBonus(){if(!requireUser())return;try{const d=await api('/api/bonus',{method:'POST',body:'{}'});setUser(d.user);sound('win');toast(`Ежедневный бонус: +${money(d.amount)} ₽`,'good')}catch(e){toast(e.message,'error')}}async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'});setUser(null);selectedUpgrade.clear();selectedContract.clear();toast('Вы вышли из аккаунта');go('cases')}catch(e){toast(e.message,'error')}}
async function init(){ $('soundBtn').textContent=soundOn?'🔊 Звук: вкл.':'🔇 Звук: выкл.';try{CATALOG=await (await fetch('/catalog.json',{cache:'no-cache'})).json()}catch(e){$('app').innerHTML='<div class="empty">Не удалось загрузить каталог. Проверьте public/catalog.json.</div>';return}try{const d=await api('/api/me');setUser(d.user)}catch(e){setUser(null)}go('cases');if(user){api('/api/presence',{method:'POST',body:'{}'}).catch(()=>{})}setInterval(()=>{if(user&&!document.hidden)api('/api/presence',{method:'POST',body:'{}'}).catch(()=>{})},45000)}
init();
</script></body></html>
